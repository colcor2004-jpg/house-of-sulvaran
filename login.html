<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | HOUSE OF SULVARAN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(201,168,76,0.15); }
        .auth-tab { flex: 1; padding: 0.6rem; background: transparent; border: none; color: var(--gray); font-family: 'Lato', sans-serif; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
        .auth-tab:hover { color: var(--gold-light); }
        .auth-panel { display: none; }
        .auth-panel.active { display: block; }
        .google-btn { width: 100%; padding: 0.8rem; background: var(--white); color: var(--black); border: none; font-family: 'Lato', sans-serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
        .google-btn:hover { background: var(--gray-light); }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; color: var(--gray); font-size: 0.75rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(201,168,76,0.15); }
        .phone-step { display: none; }
        .phone-step.active { display: block; }
        .switch-mode { color: var(--gray); font-size: 0.8rem; margin-top: 1rem; }
        .switch-mode a { color: var(--gold); cursor: pointer; text-decoration: underline; }
        .firebase-badge { display: inline-block; padding: 0.2rem 0.5rem; background: rgba(37,211,102,0.1); color: var(--whatsapp); font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; border: 1px solid rgba(37,211,102,0.2); margin-bottom: 1rem; }
        .firebase-badge.off { background: rgba(255,107,107,0.1); color: #ff6b6b; border-color: rgba(255,107,107,0.2); }
        .recaptcha-container { margin: 0.5rem 0; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <img src="logo.jpg" alt="HOUSE OF SULVARAN" class="logo-img">
            <span class="logo-text">HOUSE <span>OF SULVARAN</span></span>
            <p class="login-subtitle">Acceso al panel de administración</p>

            <!-- Estado de Firebase -->
            <div id="firebaseStatus"></div>

            <!-- MODO FIREBASE ACTIVO -->
            <div id="firebaseAuthSection" style="display:none;">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('google')">Google</button>
                    <button class="auth-tab" onclick="switchTab('email')">Email</button>
                    <button class="auth-tab" onclick="switchTab('phone')">Teléfono</button>
                    <button class="auth-tab" onclick="switchTab('admin')">Admin</button>
                </div>

                <!-- Google -->
                <div class="auth-panel active" id="panel-google">
                    <button class="google-btn" onclick="signInWithGoogle()">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Iniciar con Google
                    </button>
                    <p style="color:var(--gray);font-size:0.8rem;text-align:center;">Un solo clic. Sin contraseñas.</p>
                </div>

                <!-- Email -->
                <div class="auth-panel" id="panel-email">
                    <form id="emailForm">
                        <div class="form-group">
                            <label for="emailName">Nombre completo</label>
                            <input type="text" id="emailName" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="emailField">Correo electrónico</label>
                            <input type="email" id="emailField" placeholder="tu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="emailPassword">Contraseña</label>
                            <input type="password" id="emailPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                        </div>
                        <button type="submit" class="login-btn" id="emailSubmitBtn">Registrarme</button>
                    </form>
                    <p class="switch-mode">¿Ya tienes cuenta? <a onclick="toggleEmailMode()">Iniciar sesión</a></p>
                </div>

                <!-- Teléfono -->
                <div class="auth-panel" id="panel-phone">
                    <div class="phone-step active" id="phone-step-1">
                        <div class="form-group">
                            <label for="phoneNumber">Número de teléfono</label>
                            <input type="tel" id="phoneNumber" placeholder="+58 424-1403937" required>
                        </div>
                        <div class="recaptcha-container" id="recaptcha-container"></div>
                        <button class="login-btn" onclick="sendPhoneCode()">Enviar código SMS</button>
                    </div>
                    <div class="phone-step" id="phone-step-2">
                        <div class="form-group">
                            <label for="phoneCode">Código de verificación</label>
                            <input type="text" id="phoneCode" placeholder="123456" required>
                        </div>
                        <button class="login-btn" onclick="verifyPhoneCode()">Verificar e ingresar</button>
                        <p class="switch-mode"><a onclick="resetPhone()">Enviar código de nuevo</a></p>
                    </div>
                </div>

                <!-- Admin -->
                <div class="auth-panel" id="panel-admin">
                    <form id="adminForm">
                        <div class="form-group">
                            <label for="adminUser">Usuario Admin</label>
                            <input type="text" id="adminUser" placeholder="Usuario administrador" required>
                        </div>
                        <div class="form-group">
                            <label for="adminPass">Contraseña Admin</label>
                            <input type="password" id="adminPass" placeholder="Contraseña" required>
                        </div>
                        <button type="submit" class="login-btn">Ingresar como Admin</button>
                    </form>
                </div>
            </div>

            <!-- MODO ADMIN LOCAL (Fallback) -->
            <div id="localAuthSection">
                <form id="localForm">
                    <div class="form-group">
                        <label for="localUser">Usuario</label>
                        <input type="text" id="localUser" placeholder="Ingresa tu usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="localPass">Contraseña</label>
                        <input type="password" id="localPass" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <button type="submit" class="login-btn">Ingresar</button>
                </form>
            </div>

            <p class="login-error" id="loginError"></p>

            <a href="index.html" class="back-link">← Volver al inicio</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ============================================
        // CONFIGURACIÓN ADMIN LOCAL
        // Cambia aquí tu usuario y contraseña de admin:
        // ============================================
        const ADMIN_CREDENTIALS = {
            username: 'joseph-s-adm',
            password: 'Hos*2026',
            name: 'Administrador',
            role: 'admin'
        };
        // ============================================

        let confirmationResult = null;
        let isEmailLogin = false;

        // Detectar modo Firebase o Local
        function initAuthMode() {
            const firebaseActive = initFirebase();
            const statusDiv = document.getElementById('firebaseStatus');

            if (firebaseActive) {
                document.getElementById('firebaseAuthSection').style.display = 'block';
                document.getElementById('localAuthSection').style.display = 'none';
                statusDiv.innerHTML = '<span class="firebase-badge">🔥 Firebase activo — Clientes + Admin</span>';

                // Observar estado de autenticación
                firebaseAuth.onAuthStateChanged(user => {
                    if (user) {
                        // Usuario de Firebase autenticado
                        localStorage.setItem('housesulvaranUser', JSON.stringify({
                            uid: user.uid,
                            name: user.displayName || user.phoneNumber || user.email,
                            email: user.email,
                            phone: user.phoneNumber,
                            photo: user.photoURL,
                            role: 'client',
                            provider: user.providerData[0]?.providerId || 'unknown',
                            loginTime: new Date().toISOString()
                        }));
                        // Guardar perfil en Firestore
                        saveUserProfile(user);
                        window.location.href = 'index.html';
                    }
                });
            } else {
                document.getElementById('firebaseAuthSection').style.display = 'none';
                document.getElementById('localAuthSection').style.display = 'block';
                statusDiv.innerHTML = '<span class="firebase-badge off">🔒 Modo Admin Local</span>';
            }
        }

        // Guardar perfil en Firestore
        async function saveUserProfile(user) {
            if (!firebaseDb) return;
            try {
                await firebaseDb.collection('users').doc(user.uid).set({
                    name: user.displayName || document.getElementById('emailName')?.value || 'Cliente',
                    email: user.email || null,
                    phone: user.phoneNumber || null,
                    photoURL: user.photoURL || null,
                    provider: user.providerData[0]?.providerId || 'unknown',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error('Error guardando perfil:', e);
            }
        }

        // Tabs
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
            document.getElementById('loginError').style.display = 'none';
        }

        // Google Sign-In
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebaseAuth.signInWithPopup(provider).catch(err => {
                showError('Error con Google: ' + err.message);
            });
        }

        // Email/Password
        function toggleEmailMode() {
            isEmailLogin = !isEmailLogin;
            document.getElementById('emailSubmitBtn').textContent = isEmailLogin ? 'Iniciar sesión' : 'Registrarme';
            document.querySelector('#panel-email .switch-mode a').textContent = isEmailLogin ? 'Crear cuenta' : 'Iniciar sesión';
            const nameField = document.getElementById('emailName');
            nameField.parentElement.style.display = isEmailLogin ? 'none' : 'block';
        }

        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailField').value.trim();
            const password = document.getElementById('emailPassword').value;
            const name = document.getElementById('emailName').value.trim();

            if (isEmailLogin) {
                firebaseAuth.signInWithEmailAndPassword(email, password).catch(err => {
                    showError('Error: ' + err.message);
                });
            } else {
                firebaseAuth.createUserWithEmailAndPassword(email, password)
                    .then(cred => {
                        return cred.user.updateProfile({ displayName: name || 'Cliente' });
                    })
                    .catch(err => {
                        showError('Error: ' + err.message);
                    });
            }
        });

        // Teléfono
        function sendPhoneCode() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            if (!phoneNumber) { showError('Ingresa un número de teléfono'); return; }

            const appVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                size: 'invisible',
                callback: () => {}
            });

            firebaseAuth.signInWithPhoneNumber(phoneNumber, appVerifier)
                .then(result => {
                    confirmationResult = result;
                    document.getElementById('phone-step-1').classList.remove('active');
                    document.getElementById('phone-step-2').classList.add('active');
                    showError('Código enviado a ' + phoneNumber, 'success');
                })
                .catch(err => {
                    showError('Error: ' + err.message);
                    appVerifier.clear();
                });
        }

        function verifyPhoneCode() {
            const code = document.getElementById('phoneCode').value.trim();
            if (!code) { showError('Ingresa el código'); return; }
            if (!confirmationResult) { showError('Primero solicita un código'); return; }

            confirmationResult.confirm(code).catch(err => {
                showError('Código incorrecto: ' + err.message);
            });
        }

        function resetPhone() {
            document.getElementById('phone-step-2').classList.remove('active');
            document.getElementById('phone-step-1').classList.add('active');
            confirmationResult = null;
        }

        // Admin Local (Firebase mode)
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value;

            if (user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
                localStorage.setItem('housesulvaranUser', JSON.stringify({
                    username: ADMIN_CREDENTIALS.username,
                    role: ADMIN_CREDENTIALS.role,
                    name: ADMIN_CREDENTIALS.name,
                    loginTime: new Date().toISOString()
                }));
                window.location.href = 'admin.html';
            } else {
                showError('Usuario o contraseña de admin incorrectos');
            }
        });

        // Admin Local (Fallback mode)
        document.getElementById('localForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('localUser').value.trim();
            const pass = document.getElementById('localPass').value;

            if (user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
                localStorage.setItem('housesulvaranUser', JSON.stringify({
                    username: ADMIN_CREDENTIALS.username,
                    role: ADMIN_CREDENTIALS.role,
                    name: ADMIN_CREDENTIALS.name,
                    loginTime: new Date().toISOString()
                }));
                window.location.href = 'admin.html';
            } else {
                showError('Usuario o contraseña incorrectos');
            }
        });

        function showError(msg, type) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
            el.style.color = type === 'success' ? '#4CAF50' : '#ff6b6b';
            if (type !== 'success') setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', initAuthMode);
    </script>
</body>
</html>
